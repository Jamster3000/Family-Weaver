name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend deps
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Family Weaver v__VERSION__'
          releaseBody: |
            # Family Weaver v__VERSION__

            ## What's new
            - Added confirmation notifications when creating people, saving changes, or performing actions.
            - Update option now available in the "app" menu without restarting (choose "later" first).
            - App automatically checks for updates every 2 hours (configurable).
            - Implemented Settings panel focused on accessibility (accessible from "app" menu).
            - Increased modal title sizes for better visual hierarchy.
            - Added logging viewer under "Logs" in the "app" menu for debugging.
            - Improved tree loading animation performance with seasonal variations (autumn leaves, no winter leaves).

            ## Under the Hood
            - Fixed markdown rendering in "What's new" modal.
            - Fixed modal close state management in `CreateTree`, `SwitchTreeModal`, and `RenameTreeTitle`.
            - Renamed "upload" tab to "media" in create person modal.
            - Renamed toolbar "Settings" to "app" for better context.
            - Minor performance improvements and bug fixes.
          releaseDraft: false
          prerelease: false