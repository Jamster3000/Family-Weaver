name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend deps
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Family Weaver v__VERSION__'
          releaseBody: |
            # Family Weaver v__VERSION__

            This version adds the second most important feature to Family Weaver.
            The rendering which shows people and relationships.

            Please bare in mind that this rendering of the tree and each person is actively
            experiemental. You almost definitely will find something in the wrong place, lines going to the wrong places,
            and other visual problems.

            ## What's new
            - You can now add relationships when creating people adding parents, children, and spouses to your family tree.
            - Fixed bug where `What's new` didn't format correctly.

            ## Under the Hood
            -
          releaseDraft: false
          prerelease: false